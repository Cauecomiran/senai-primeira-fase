<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>atv3</title>


    <link rel="stylesheet" href="array3.css">
</head>
<body>
    
    <div>
        <h1>
            metodos de array
        </h1>
        <p>
            Vamos aprender e praticar as formas de manipular um array! 
        </p>
    </div>
    <hr>

    <section class="add-elementos">
        <h2>
            Adicionar elementos ao array:
        </h2>

        <label for="addElemento">Adicicionar ao array:</label>
        <input id="addElemento" type="text" placeholder="digite aqui!">
        <button onclick="adicionarPush()">+</button>


        <div id="container-push">

            O seu array vai parecer aqui!

        </div>
    </section>
    <hr>

    <section id="add-inicio">


        <h2>
            Adicionar elementos ao inicio
        </h2>

        <label for="input-unshift">Adicionar ao inicio:</label>
        <input id="input-unshift" type="text" placeholder="digite aqui!">

        <button onclick="addPush()">+</button>

        <div id="resposta-unshift">
            aqui vai a resposta-unshift

        </div>





    </section>
    



    <script src="array3.js"></script>
</body>
</html>
